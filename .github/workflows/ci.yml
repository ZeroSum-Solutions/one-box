name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Rendered Page IR regressions
        env:
          ONEBOX_BASE_URL: http://127.0.0.1:3000
          ONE_BOX_REFERO_OAUTH_STORE: ${{ runner.temp }}/one-box-no-refero.json
        run: |
          npm run start > "$RUNNER_TEMP/one-box-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e 'let attempts=0; const poll=async()=>{try{const response=await fetch(process.env.ONEBOX_BASE_URL); if(response.ok) return;}catch{} if(++attempts>=60) process.exit(1); setTimeout(poll,500)}; poll()'
          npm run test:e2e:page-ir
