name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Verify plan authority and traceability
        run: npm run verify:plans && npm run test:plans

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Rendered Page IR regressions
        env:
          ONEBOX_BASE_URL: http://127.0.0.1:3000
          ONE_BOX_REFERO_OAUTH_STORE: ${{ runner.temp }}/one-box-no-refero.json
        run: |
          python3 -c 'import os,sys; os.setsid(); os.execvp(sys.argv[1], sys.argv[1:])' \
            npm run start -- --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/one-box-next.log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            kill -TERM "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          node -e 'let attempts=0; const poll=async()=>{try{const response=await fetch(process.env.ONEBOX_BASE_URL,{signal:AbortSignal.timeout(1000)}); if(response.ok) return;}catch{} if(++attempts>=60) process.exit(1); setTimeout(poll,500)}; poll()'
          npm run test:e2e:page-ir
