name: Feature request
description: Propose a focused improvement to ONE BOX
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not an implementation prescription.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: List the smallest useful first slice and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give testable behavior, including evidence or human-approval boundaries.
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Note affected paths under `src/app`, `src/lib`, `templates/local-service`, `sites/<id>`, or `src/lib/contracts.ts`.
  - type: textarea
    id: traceability
    attributes:
      label: Authority and traceability
      description: Link the canonical authority plus stable requirement, evaluation, and ticket IDs. Say explicitly if this is proposed planning rather than authorized implementation.
      placeholder: |
        Authority: docs/...
        Requirements: REQ-...
        Evaluations: EVAL-...
        Ticket: OBX-...
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk, data, supply chain, and rollback
      description: Identify trust/data boundaries, dependencies or licenses, telemetry, migration/compatibility, rollout, rollback, kill switch, and required reviewer roles.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included credentials or private client data.
          required: true
